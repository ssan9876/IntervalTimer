# Xcode project definition for App Store builds (generated on the cloud Mac with `xcodegen generate`).
# Day-to-day development uses xtool (Package.swift + xtool.yml); both build the same sources.
name: IntervalTimer
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is passed in by the build workflow from the APPLE_TEAM_ID variable.
targets:
  # Shared by the app and the widget. Static, so nothing extra is embedded or signed.
  IntervalKit:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/IntervalKit
    settings:
      base:
        PRODUCT_NAME: IntervalKit
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  IntervalTimer:
    type: application
    platform: iOS
    sources:
      - path: Sources/IntervalTimer
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: IntervalKit
      - target: IntervalTimerWidget
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: IntervalTimer
        PRODUCT_BUNDLE_IDENTIFIER: com.sethsander.intervals
        # Version keys are left out of the plist on purpose: Xcode fills them in from
        # MARKETING_VERSION and CURRENT_PROJECT_VERSION, so app and widget always match.
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  IntervalTimerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/IntervalTimerWidget
    dependencies:
      - target: IntervalKit
    settings:
      base:
        PRODUCT_NAME: IntervalTimerWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.sethsander.intervals.widget
        INFOPLIST_FILE: Widget-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
